name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan for secrets and private data
        run: node scripts/check-secrets.mjs

      - name: Test workflows and Code node logic
        run: node --test
